name: Application

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  application:
    name: application
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out the reviewed revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Prepare Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: model/requirements-model.txt

      - name: Resolve the pinned Rust toolchain
        run: tools/install-rustup.sh

      - name: Restore the Rust build and tool cache
        id: rust-cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Install pinned check dependencies
        run: tools/prepare-application-ci.sh

      - name: Run application and model checks
        run: tools/check-application.sh

      - name: Report Rust cache result
        if: always()
        run: echo "rust-cache-hit=${{ steps.rust-cache.outputs.cache-hit }}"
