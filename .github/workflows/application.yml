name: Application

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  application:
    name: application
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres@sha256:92620daddcd947f8d5ab5ba66e848702fe443d87fed30c4cea8e389fd78dfc55 # 16.14-bookworm
        env:
          POSTGRES_DB: patchyard_ci
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d patchyard_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres@localhost:5432/patchyard_ci?sslmode=disable
      FACTORY_TEST_ADMIN_DATABASE_URL: postgresql://postgres@localhost:5432/patchyard_ci?sslmode=disable
      FACTORY_TEST_DATABASE_URL: postgresql://patchyard_supervisor@localhost:5432/patchyard_ci?sslmode=disable

    steps:
      - name: Check out the reviewed revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install reviewer sandbox runtime
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends bubblewrap
          if sysctl kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl --write kernel.apparmor_restrict_unprivileged_userns=0
          fi
          /usr/bin/bwrap \
            --unshare-all \
            --die-with-parent \
            --new-session \
            --ro-bind /usr /usr \
            --symlink usr/bin /bin \
            --symlink usr/lib /lib \
            --symlink usr/lib64 /lib64 \
            --proc /proc \
            --dev /dev \
            --tmpfs /tmp \
            /usr/bin/true

      - name: Prepare Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: model/requirements-model.txt

      - name: Resolve the pinned Rust toolchain
        run: tools/install-rustup.sh

      - name: Restore the Rust build and tool cache
        id: rust-cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Install pinned check dependencies
        run: tools/prepare-application-ci.sh

      - name: Prepare disposable PostgreSQL state service
        env:
          POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
        run: tools/prepare-state-ci.sh

      - name: Run application and model checks
        env:
          POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
        run: tools/check-application.sh

      - name: Report Rust cache result
        if: always()
        run: echo "rust-cache-hit=${{ steps.rust-cache.outputs.cache-hit }}"
