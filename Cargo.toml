[workspace]
members = [
    "crates/factory-core",
    "crates/factory-supervisor",
    "crates/factory-verify",
    "crates/factoryctl",
    "crates/factory-web",
]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"

[workspace.dependencies]
argon2 = { version = "0.5.3", features = ["std"] }
askama = { version = "0.16.0", default-features = false, features = ["derive", "std"] }
axum = { version = "0.8.9", default-features = false, features = ["form", "http1", "multipart", "query", "tokio"] }
base64 = "0.22.1"
clap = { version = "4.6.3", features = ["derive", "env"] }
globset = "0.4.19"
hex = "0.4.3"
http-body-util = "0.1.4"
image = { version = "0.25.9", default-features = false, features = ["jpeg", "png"] }
metrics = "0.24.3"
metrics-exporter-prometheus = { version = "0.18.3", default-features = false, features = ["http-listener"] }
opentelemetry = { version = "0.32.0", default-features = false, features = ["trace"] }
opentelemetry-otlp = { version = "0.32.0", default-features = false, features = ["http-proto", "reqwest-blocking-client", "trace"] }
opentelemetry_sdk = { version = "0.32.0", default-features = false, features = ["trace"] }
proptest = "1.11.0"
pulldown-cmark = { version = "0.13.4", default-features = false, features = ["html"] }
rustix = { version = "1.1.4", features = ["fs"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.9"
sqlx = { version = "0.9.0", default-features = false, features = [
    "json",
    "macros",
    "migrate",
    "postgres",
    "runtime-tokio",
    "time",
    "tls-rustls-ring-webpki",
    "uuid",
] }
stringprep = "0.1.5"
thiserror = "2.0.18"
time = { version = "0.3.54", features = ["formatting", "parsing", "serde"] }
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7.18", features = ["rt"] }
tokio-stream = { version = "0.1.19", default-features = false, features = ["sync"] }
tower = { version = "0.5.3", features = ["util"] }
tracing = "0.1.44"
tracing-opentelemetry = { version = "0.33.0", default-features = false }
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
unicode-normalization = "0.1.25"
uuid = { version = "1.24.0", features = ["serde", "v4"] }
