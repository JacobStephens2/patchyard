[workspace]
members = [
    "crates/factory-core",
    "crates/factory-supervisor",
    "crates/factory-verify",
    "crates/factoryctl",
    "crates/factory-web",
]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.97.1"
license = "LicenseRef-Proprietary"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"

[workspace.dependencies]
clap = { version = "4.6.3", features = ["derive", "env"] }
globset = "0.4.19"
hex = "0.4.3"
metrics = "0.24.3"
metrics-exporter-prometheus = { version = "0.18.3", default-features = false, features = ["http-listener"] }
opentelemetry = { version = "0.32.0", default-features = false, features = ["trace"] }
opentelemetry-otlp = { version = "0.32.0", default-features = false, features = ["http-proto", "reqwest-blocking-client", "trace"] }
opentelemetry_sdk = { version = "0.32.0", default-features = false, features = ["trace"] }
proptest = "1.11.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.9"
sqlx = { version = "0.9.0", default-features = false, features = [
    "json",
    "macros",
    "migrate",
    "postgres",
    "runtime-tokio",
    "time",
    "tls-rustls-ring-webpki",
    "uuid",
] }
stringprep = "0.1.5"
thiserror = "2.0.18"
time = { version = "0.3.54", features = ["formatting", "serde"] }
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7.18", features = ["rt"] }
tracing = "0.1.44"
tracing-opentelemetry = { version = "0.33.0", default-features = false }
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
unicode-normalization = "0.1.25"
uuid = { version = "1.24.0", features = ["serde", "v4"] }
