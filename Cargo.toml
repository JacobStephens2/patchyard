[workspace]
members = [
    "crates/factory-core",
    "crates/factory-verify",
    "crates/factoryctl",
    "crates/factory-web",
]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.97.1"
license = "LicenseRef-Proprietary"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"

[workspace.dependencies]
clap = { version = "4.6.3", features = ["derive", "env"] }
hex = "0.4.3"
proptest = "1.11.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.9"
sqlx = { version = "0.9.0", default-features = false, features = [
    "json",
    "macros",
    "migrate",
    "postgres",
    "runtime-tokio",
    "time",
    "tls-rustls-ring-webpki",
    "uuid",
] }
stringprep = "0.1.5"
thiserror = "2.0.18"
time = { version = "0.3.54", features = ["formatting", "serde"] }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "time"] }
unicode-normalization = "0.1.25"
uuid = { version = "1.24.0", features = ["serde", "v4"] }
