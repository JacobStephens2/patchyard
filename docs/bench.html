<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bench pairs</title>
    <style>
        :root {
            color-scheme: light;
            --ink: #171717;
            --muted: #5f646b;
            --line: #d9d7cf;
            --paper: #fbfaf6;
            --panel: #fff;
            --accent: #206b6f;
            --accent-2: #8a4f1d;
            --bad: #9c2d25;
            --ok: #247247
        }

        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            background: var(--paper);
            color: var(--ink);
            font: 14px/1.45 ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif
        }

        header {
            position: sticky;
            top: 0;
            z-index: 3;
            border-bottom: 1px solid var(--line);
            background: rgba(251, 250, 246, .96);
            backdrop-filter: blur(10px)
        }

        .bar {
            display: grid;
            grid-template-columns: minmax(180px, 1fr) minmax(260px, 520px) auto;
            gap: 16px;
            align-items: center;
            padding: 16px 22px
        }

        h1 {
            margin: 0;
            font-size: 20px;
            letter-spacing: 0;
            font-weight: 700
        }

        .source {
            color: var(--muted);
            font-size: 12px
        }

        .source a {
            color: var(--accent)
        }

        label {
            display: grid;
            gap: 4px;
            color: var(--muted);
            font-size: 12px
        }

        input {
            width: 100%;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: #fff;
            color: var(--ink);
            padding: 10px 12px;
            font: inherit
        }

        main {
            padding: 18px 22px 28px
        }

        .meta {
            display: flex;
            flex-wrap: wrap;
            gap: 10px 18px;
            align-items: center;
            margin-bottom: 12px;
            color: var(--muted)
        }

        .pill {
            border: 1px solid var(--line);
            border-radius: 999px;
            background: #fff;
            padding: 4px 10px
        }

        .table-wrap {
            border: 1px solid var(--line);
            background: var(--panel);
            overflow: auto;
            max-height: calc(100vh - 150px)
        }

        table {
            width: 100%;
            min-width: 1360px;
            border-collapse: separate;
            border-spacing: 0
        }

        th,
        td {
            border-bottom: 1px solid var(--line);
            border-right: 1px solid var(--line);
            vertical-align: top;
            text-align: left
        }

        th {
            position: sticky;
            top: 0;
            z-index: 2;
            background: #ece8dc;
            color: #2b2b2b;
            font-size: 12px;
            text-transform: uppercase
        }

        th button {
            all: unset;
            display: flex;
            gap: 7px;
            align-items: center;
            width: 100%;
            min-height: 42px;
            padding: 9px 10px;
            cursor: pointer
        }

        th button:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: -2px
        }

        td {
            padding: 10px;
            overflow-wrap: anywhere
        }

        td:nth-child(1) {
            font-weight: 700;
            min-width: 190px
        }

        td:nth-child(9) {
            min-width: 470px
        }

        a {
            color: var(--accent);
            text-decoration-thickness: 1px;
            text-underline-offset: 2px
        }

        code {
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            background: #f2efe6;
            border: 1px solid #e0dbcc;
            border-radius: 4px;
            padding: 1px 4px
        }

        .ok {
            color: var(--ok);
            font-weight: 650
        }

        .bad {
            color: var(--bad);
            font-weight: 650
        }

        .unknown {
            color: var(--accent-2);
            font-weight: 650
        }

        .error {
            border-left: 4px solid var(--bad);
            background: #fff2ef;
            padding: 12px 14px
        }

        @media (max-width:760px) {
            .bar {
                grid-template-columns: 1fr;
                padding: 13px
            }

            main {
                padding: 13px
            }

            .table-wrap {
                max-height: none
            }

            h1 {
                font-size: 18px
            }
        }
    </style>
</head>

<body>
    <header>
        <div class="bar">
            <div>
                <h1>Bench pairs</h1>
                <div class="source">Live projection from <a href="bench.json">docs/bench.json</a> &middot; prose and
                    seat orders: <a href="bench.md">bench.md</a></div>
            </div><label>Filter<input id="filter" type="search" autocomplete="off"
                    placeholder="Model, harness, host, status"></label>
            <div class="pill" id="count">Loading</div>
        </div>
    </header>
    <main>
        <div class="meta" id="meta"></div>
        <div class="table-wrap">
            <table id="pairs"></table>
        </div>
    </main>
    <script>
        const source = "bench.json", table = document.querySelector("#pairs"), count = document.querySelector("#count"), meta = document.querySelector("#meta"), filter = document.querySelector("#filter");
        const FLOOR = { pass: { icon: "✅", cls: "ok", rank: 2 }, fail: { icon: "❌", cls: "bad", rank: 0 }, untested: { icon: "-", cls: "", rank: -1 } };
        const IMAGE = { yes: { icon: "✅", cls: "ok", rank: 2 }, unknown: { icon: "?", cls: "unknown", rank: 1 }, no: { icon: "❌", cls: "bad", rank: 0 } };
        let columns = [], rows = [], sortCol = -1, sortDir = 1;
        fetch(source, { cache: "no-store" }).then(r => { if (!r.ok) throw Error(`${source}: ${r.status}`); return r.json() }).then(init).catch(showError);
        filter.addEventListener("input", render);
        table.addEventListener("click", event => { const button = event.target.closest("button[data-col]"); if (!button) return; const col = Number(button.dataset.col); sortDir = sortCol === col ? -sortDir : columns[col].descFirst ? -1 : 1; sortCol = col; render() });
        function iconCell(field, icons) { const spec = icons[field.status]; const text = field.detail ? `${spec.icon} ${field.detail}` : spec.icon; return { html: inlineMarkdown(text), text: plain(text), sort: spec.rank, cls: spec.cls } }
        function textCell(value) { return { html: escapeHtml(value), text: value, sort: value.toLowerCase() } }
        function markdownCell(value) { return { html: inlineMarkdown(value), text: plain(value), sort: plain(value).toLowerCase() } }
        function makeColumns(aaVersion) {
            return [
                { label: "Model", cell: p => textCell(p.model) },
                { label: "Effort", cell: p => textCell(p.effort) },
                { label: "Harness", cell: p => textCell(p.harness) },
                { label: "Preferred Harness", cell: p => ({ html: p.preferred_harness ? "Yes" : "No", text: p.preferred_harness ? "Yes" : "No", sort: p.preferred_harness ? 1 : 0 }) },
                { label: "Host", cell: p => markdownCell(p.host) },
                { label: "Floor", cell: p => iconCell(p.floor, FLOOR) },
                { label: "Img-in", cell: p => iconCell(p.image_input, IMAGE) },
                { label: "Provenance", cell: p => markdownCell(p.provenance) },
                { label: "Current standing", cell: p => markdownCell(p.standing) },
                { label: "Visible t/s", descFirst: true, cell: p => ({ html: escapeHtml(p.visible_tps), text: p.visible_tps, sort: maxNumber(p.visible_tps) }) },
                { label: "Long-spec wall", cell: p => textCell(p.long_spec_wall) },
                { label: `AA Intelligence (v${aaVersion})`, descFirst: true, cell: p => ({ html: p.aa_intelligence === null ? "" : String(p.aa_intelligence), text: p.aa_intelligence === null ? "" : String(p.aa_intelligence), sort: p.aa_intelligence === null ? Number.NEGATIVE_INFINITY : p.aa_intelligence }) }
            ]
        }
        function init(data) { columns = makeColumns(data.aa_index_version); rows = data.pairs.map((pair, index) => ({ index, cells: columns.map(column => column.cell(pair)) })); meta.innerHTML = `<span class="pill">${rows.length} pairs from ${source}</span><span>Pairs data as of ${escapeHtml(data.last_updated)}${data.update_note ? ` (${escapeHtml(data.update_note)})` : ""}.</span>`; render() }
        function render() { const term = filter.value.trim().toLowerCase(); let visible = rows.filter(row => row.cells.map(cell => cell.text).join(" ").toLowerCase().includes(term)); if (sortCol >= 0) visible = [...visible].sort(compareRows); count.textContent = `${visible.length} / ${rows.length}`; table.innerHTML = `<thead><tr>${columns.map((column, index) => `<th aria-sort="${ariaSort(index)}"><button type="button" data-col="${index}"><span>${escapeHtml(column.label)}</span><span>${sortMark(index)}</span></button></th>`).join("")}</tr></thead><tbody>${visible.map(row => `<tr>${row.cells.map(cell => `<td class="${cell.cls || ""}">${cell.html}</td>`).join("")}</tr>`).join("")}</tbody>` }
        function compareRows(a, b) { const left = a.cells[sortCol].sort, right = b.cells[sortCol].sort; const result = typeof left === "number" && typeof right === "number" ? left - right : String(left).localeCompare(String(right), undefined, { numeric: true, sensitivity: "base" }); return result ? result * sortDir : a.index - b.index }
        function maxNumber(value) { const numbers = value.replace(/,/g, "").match(/\d+(?:\.\d+)?/g); return numbers ? Math.max(...numbers.map(Number)) : Number.NEGATIVE_INFINITY }
        function inlineMarkdown(value) { return escapeHtml(value).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\[([^\]]+)\]\(([^)]+)\)/g, (_, text, url) => `<a href="${safeHref(url)}">${text}</a>`).replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>").replace(/\*([^*]+)\*/g, "<em>$1</em>") }
        function safeHref(url) { const href = url.trim(); return /^(https?:\/\/|\.{0,2}\/|[A-Za-z0-9_.-]+\/?|#)/.test(href) ? escapeAttr(href) : "#" }
        function plain(value) { return value.replace(/[`*_]/g, "").replace(/\[([^\]]+)\]\([^)]+\)/g, "$1") }
        function ariaSort(index) { return sortCol === index ? (sortDir > 0 ? "ascending" : "descending") : "none" }
        function sortMark(index) { return sortCol === index ? (sortDir > 0 ? "^" : "v") : "" }
        function escapeHtml(value) { return value.replace(/[&<>"']/g, char => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[char])) }
        function escapeAttr(value) { return escapeHtml(value).replace(/`/g, "&#96;") }
        function showError(error) { count.textContent = "Error"; meta.innerHTML = `<div class="error">Could not load ${source}. Serve docs over HTTP, then refresh. ${escapeHtml(error.message)}</div>` }
    </script>
</body>

</html>
