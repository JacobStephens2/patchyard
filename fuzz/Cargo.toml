[package]
name = "patchyard-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
factory-web = { path = "../crates/factory-web" }
libfuzzer-sys = "=0.4.13"

[dev-dependencies]
image = { version = "0.25.9", default-features = false, features = ["jpeg", "png"] }

[[bin]]
name = "ingest_decode"
path = "fuzz_targets/ingest_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "canonical_path"
path = "fuzz_targets/canonical_path.rs"
test = false
doc = false
bench = false

[workspace]
