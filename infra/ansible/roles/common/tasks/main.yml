---
- name: Require the reviewed Rocky Linux base image
  ansible.builtin.assert:
    that:
      - ansible_distribution == 'Rocky'
      - ansible_distribution_major_version == '9'
    fail_msg: "Factory desired state supports Rocky Linux 9 only."

- name: Set the desired hostname
  ansible.builtin.hostname:
    name: "{{ inventory_hostname }}"

- name: Install base administration packages
  ansible.builtin.dnf:
    name:
      - ca-certificates
      - curl
      - firewalld
      - git
      - jq
      - nftables
      - rsync
      - tar
      - unzip
    state: present

- name: Create the orchestration bootstrap and break-glass identity
  ansible.builtin.user:
    name: conductor
    comment: Patchyard orchestration bootstrap and break-glass identity
    groups: wheel
    append: true
    create_home: true
    password_lock: true
    shell: /bin/bash

- name: Authorize the orchestration break-glass public key
  ansible.posix.authorized_key:
    user: conductor
    key: "{{ breakglass_public_key }}"
    exclusive: true
    state: present

- name: Grant the break-glass identity passwordless sudo
  ansible.builtin.copy:
    dest: /etc/sudoers.d/patchyard-conductor
    content: "conductor ALL=(ALL) NOPASSWD:ALL\n"
    owner: root
    group: root
    mode: "0440"
    validate: /usr/sbin/visudo -cf %s

- name: Create the factory management group
  ansible.builtin.group:
    name: "{{ factory_manager_user }}"
    system: true

- name: Create the factory management identity
  ansible.builtin.user:
    name: "{{ factory_manager_user }}"
    comment: Patchyard Factory control-plane management identity
    groups: wheel
    group: "{{ factory_manager_user }}"
    append: true
    create_home: true
    home: "{{ factory_manager_home }}"
    password_lock: true
    shell: /bin/bash
    system: true

- name: Create the factory management SSH directory
  ansible.builtin.file:
    path: "{{ factory_manager_home }}/.ssh"
    state: directory
    owner: "{{ factory_manager_user }}"
    group: "{{ factory_manager_user }}"
    mode: "0700"

- name: Generate the control-plane-owned factory management key
  ansible.builtin.command:
    argv:
      - ssh-keygen
      - -q
      - -t
      - ed25519
      - -N
      - ""
      - -C
      - factory-manager@factory-control.example.com
      - -f
      - "{{ factory_manager_private_key }}"
    creates: "{{ factory_manager_private_key }}"
  become: true
  become_user: "{{ factory_manager_user }}"
  when: inventory_hostname in groups['control_plane']

- name: Enforce factory management private-key permissions
  ansible.builtin.file:
    path: "{{ factory_manager_private_key }}"
    owner: "{{ factory_manager_user }}"
    group: "{{ factory_manager_user }}"
    mode: "0600"
  when: inventory_hostname in groups['control_plane']

- name: Read the factory management public key from the control plane
  ansible.builtin.slurp:
    src: "{{ factory_manager_private_key }}.pub"
  delegate_to: "{{ groups['control_plane'][0] }}"
  run_once: true
  register: factory_manager_public_key

- name: Authorize only the factory control-plane management key
  ansible.posix.authorized_key:
    user: "{{ factory_manager_user }}"
    key: "{{ factory_manager_public_key.content | b64decode | trim }}"
    exclusive: true
    state: present

- name: Read each factory host SSH public key
  ansible.builtin.slurp:
    src: /etc/ssh/ssh_host_ed25519_key.pub
  register: factory_host_ssh_public_key

- name: Pin each factory host key for control-plane management
  ansible.builtin.known_hosts:
    path: "{{ factory_manager_home }}/.ssh/known_hosts"
    name: "{{ private_ip }}"
    key: >-
      {{ private_ip }}
      {{ (factory_host_ssh_public_key.content | b64decode).split()[0] }}
      {{ (factory_host_ssh_public_key.content | b64decode).split()[1] }}
    state: present
  delegate_to: "{{ groups['control_plane'][0] }}"
  throttle: 1

- name: Restrict the factory management known-hosts file
  ansible.builtin.file:
    path: "{{ factory_manager_home }}/.ssh/known_hosts"
    owner: "{{ factory_manager_user }}"
    group: "{{ factory_manager_user }}"
    mode: "0600"
  delegate_to: "{{ groups['control_plane'][0] }}"
  run_once: true

- name: Grant the factory management identity passwordless sudo
  ansible.builtin.copy:
    dest: /etc/sudoers.d/patchyard-manager
    content: "{{ factory_manager_user }} ALL=(ALL) NOPASSWD:ALL\n"
    owner: root
    group: root
    mode: "0440"
    validate: /usr/sbin/visudo -cf %s

- name: Install the factory SSH policy
  ansible.builtin.template:
    src: 60-patchyard.conf.j2
    dest: /etc/ssh/sshd_config.d/60-patchyard.conf
    owner: root
    group: root
    mode: "0600"
  notify: Restart sshd

- name: Create journald configuration directory
  ansible.builtin.file:
    path: /etc/systemd/journald.conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Bound persistent journal retention
  ansible.builtin.copy:
    dest: /etc/systemd/journald.conf.d/60-patchyard.conf
    content: |
      [Journal]
      Storage=persistent
      SystemMaxUse=1G
      MaxRetentionSec=7day
      Compress=yes
    owner: root
    group: root
    mode: "0644"
  notify: Restart journald

- name: Enable firewalld
  ansible.builtin.systemd:
    name: firewalld
    enabled: true
    state: started

- name: Make the public zone fail closed
  ansible.posix.firewalld:
    zone: public
    target: DROP
    state: present
    permanent: true
    immediate: false
  notify: Reload firewalld

- name: Remove unrestricted SSH service access
  ansible.posix.firewalld:
    zone: public
    service: ssh
    state: disabled
    permanent: true
    immediate: true

- name: Allow bootstrap and break-glass SSH from orchestration
  ansible.posix.firewalld:
    zone: public
    rich_rule: >-
      rule family="ipv4" source address="{{ orchestration_public_cidr }}"
      service name="ssh" accept
    state: enabled
    permanent: true
    immediate: true

- name: Allow normal factory management only from the control-plane VPC address
  ansible.posix.firewalld:
    zone: public
    rich_rule: >-
      rule family="ipv4" source address="{{ control_plane_private_cidr }}"
      service name="ssh" accept
    state: enabled
    permanent: true
    immediate: true

- name: Allow exporter scrapes only from fleet monitoring
  ansible.posix.firewalld:
    zone: public
    rich_rule: >-
      rule family="ipv4" source address="{{ monitoring_private_cidr }}"
      port port="{{ item }}" protocol="tcp" accept
    state: enabled
    permanent: true
    immediate: true
  loop:
    - "9100"
    - "9187"

- name: Allow supervisor metric scrapes only from fleet monitoring
  ansible.posix.firewalld:
    zone: public
    rich_rule: >-
      rule family="ipv4" source address="{{ monitoring_private_cidr }}"
      port port="9464" protocol="tcp" accept
    state: enabled
    permanent: true
    immediate: true
  when: factory_role == 'control-plane'

- name: Allow the sole PostgreSQL TCP reader only from fleet monitoring
  ansible.posix.firewalld:
    zone: public
    rich_rule: >-
      rule family="ipv4" source address="{{ monitoring_private_cidr }}"
      port port="5432" protocol="tcp" accept
    state: enabled
    permanent: true
    immediate: true
  when: factory_role == 'control-plane'

- name: Keep PostgreSQL closed on the secret-free worker
  ansible.posix.firewalld:
    zone: public
    port: 5432/tcp
    state: disabled
    permanent: true
    immediate: true
  when: factory_role == 'worker'

- name: Expose HTTP and HTTPS on the control plane only
  ansible.posix.firewalld:
    zone: public
    service: "{{ item }}"
    state: enabled
    permanent: true
    immediate: true
  loop:
    - http
    - https
  when: factory_role == 'control-plane'

- name: Ensure HTTP and HTTPS stay closed on the worker
  ansible.posix.firewalld:
    zone: public
    service: "{{ item }}"
    state: disabled
    permanent: true
    immediate: true
  loop:
    - http
    - https
  when: factory_role == 'worker'
