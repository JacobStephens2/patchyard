---
- name: Restart PostgreSQL
  ansible.builtin.systemd:
    name: postgresql.service
    state: restarted
    daemon_reload: true

- name: Restart control-plane exporters
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: restarted
    daemon_reload: true
  loop:
    - node-exporter.service
    - postgres-exporter.service

- name: Restart factory supervisor
  ansible.builtin.systemd:
    name: factory-supervisor.service
    state: restarted
    daemon_reload: true
  when: not (factory_restore_drill | default(false) | bool)

- name: Restart factory dashboard
  ansible.builtin.systemd:
    name: factory-dashboard.service
    state: restarted
    daemon_reload: true
  when: not (factory_restore_drill | default(false) | bool)

- name: Restart Caddy
  ansible.builtin.systemd:
    name: caddy.service
    state: restarted
    daemon_reload: true
  when: not (factory_restore_drill | default(false) | bool)

- name: Reload Caddy
  ansible.builtin.systemd:
    name: caddy.service
    state: reloaded
  when: not (factory_restore_drill | default(false) | bool)

- name: Restart Polkit
  ansible.builtin.systemd:
    name: polkit.service
    state: restarted
