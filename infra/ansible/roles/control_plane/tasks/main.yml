---
- name: Install EPEL for headless Chromium
  ansible.builtin.dnf:
    name: epel-release
    state: present

- name: Install control-plane packages
  ansible.builtin.dnf:
    name:
      - "{{ chromium_nevra }}"
      - bubblewrap
      - fontconfig
      - git
      - "{{ github_cli_nevra }}"
      - iproute
      - nftables
      - policycoreutils-python-utils
      - polkit
      - python3-pip
    state: present
  tags: [session13]

- name: Keep the factory control plane in its non-router baseline
  ansible.posix.sysctl:
    name: net.ipv4.ip_forward
    value: "0"
    state: present
    sysctl_file: /etc/sysctl.d/90-patchyard-child.conf
    sysctl_set: true
    reload: true
  tags: [session13]

- name: Create the factory-owned Ansible desired-state directory
  ansible.builtin.file:
    path: /usr/local/share/patchyard/ansible
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install the pinned Ansible controller manifests
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/{{ item }}"
    dest: "/usr/local/share/patchyard/ansible/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - requirements.txt
    - requirements.yml

- name: Install the pinned control-plane Ansible environment
  ansible.builtin.pip:
    requirements: /usr/local/share/patchyard/ansible/requirements.txt
    virtualenv: /opt/patchyard-ansible
    virtualenv_command: /usr/bin/python3 -m venv

- name: Inspect the installed ansible.posix collection
  ansible.builtin.command:
    argv:
      - /opt/patchyard-ansible/bin/ansible-galaxy
      - collection
      - list
      - ansible.posix
  environment:
    ANSIBLE_COLLECTIONS_PATH: /opt/patchyard-ansible/collections
  register: factory_ansible_posix_collection
  changed_when: false
  failed_when: false

- name: Install the pinned ansible.posix collection
  ansible.builtin.command:
    argv:
      - /opt/patchyard-ansible/bin/ansible-galaxy
      - collection
      - install
      - --collections-path
      - /opt/patchyard-ansible/collections
      - --requirements-file
      - /usr/local/share/patchyard/ansible/requirements.yml
  when: "'ansible.posix 1.5.4' not in factory_ansible_posix_collection.stdout"
  changed_when: true

- name: Create the factory service group
  ansible.builtin.group:
    name: factory
    system: true

- name: Create the dashboard-private service group
  ansible.builtin.group:
    name: factory-web
    system: true

- name: Enable the pinned PostgreSQL AppStream server profile
  ansible.builtin.dnf:
    name: "@postgresql:{{ postgresql_stream }}/server"
    state: present

- name: Install the exact reviewed PostgreSQL packages
  ansible.builtin.dnf:
    name:
      - "postgresql-{{ postgresql_version }}-{{ postgresql_package_release }}"
      - "postgresql-contrib-{{ postgresql_version }}-{{ postgresql_package_release }}"
      - "postgresql-server-{{ postgresql_version }}-{{ postgresql_package_release }}"
    state: present
    allow_downgrade: true

- name: Give PostgreSQL permission to own the restricted socket group
  ansible.builtin.user:
    name: postgres
    groups:
      - factory
    append: true
  notify: Restart PostgreSQL

- name: Give the exporter access to the restricted database socket
  ansible.builtin.user:
    name: postgres_exporter
    groups:
      - factory
    append: true
  notify: Restart control-plane exporters

- name: Allow the factory management identity to traverse factory-owned state
  ansible.builtin.user:
    name: "{{ factory_manager_user }}"
    groups:
      - factory
      - factory-web
    append: true

- name: Create the dashboard service identity
  ansible.builtin.user:
    name: factory-web
    comment: Patchyard Factory dashboard service
    create_home: false
    group: factory-web
    groups:
      - factory
    home: /var/lib/patchyard
    password_lock: true
    shell: /usr/sbin/nologin
    system: true

- name: Create the factory state root
  ansible.builtin.file:
    path: /var/lib/patchyard
    state: directory
    owner: root
    group: factory
    mode: "0750"

- name: Create the dashboard-readable artifact root
  ansible.builtin.file:
    path: /var/lib/patchyard/artifacts
    state: directory
    owner: "{{ factory_manager_user }}"
    group: factory-web
    mode: "2750"

- name: Create the dashboard-private clean-upload root
  ansible.builtin.file:
    path: /var/lib/patchyard/artifacts/uploads
    state: directory
    owner: factory-web
    group: factory-web
    mode: "0700"

- name: Find existing artifact directories
  ansible.builtin.find:
    paths: /var/lib/patchyard/artifacts
    file_type: directory
    recurse: true
    excludes:
      - uploads
  register: factory_artifact_directories

- name: Enforce setgid dashboard-readable artifact directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    owner: "{{ factory_manager_user }}"
    group: factory-web
    mode: "2750"
  loop: "{{ factory_artifact_directories.files }}"
  loop_control:
    label: "{{ item.path }}"

- name: Find existing artifact files
  ansible.builtin.find:
    paths: /var/lib/patchyard/artifacts
    file_type: file
    recurse: true
    excludes:
      - uploads
  register: factory_artifact_files

- name: Enforce dashboard-readable, non-executable artifact files
  ansible.builtin.file:
    path: "{{ item.path }}"
    owner: "{{ factory_manager_user }}"
    group: factory-web
    mode: "0640"
  loop: "{{ factory_artifact_files.files }}"
  loop_control:
    label: "{{ item.path }}"

- name: Create supervisor-owned private factory state directories
  ansible.builtin.file:
    path: "/var/lib/patchyard/{{ item }}"
    state: directory
    owner: "{{ factory_manager_user }}"
    group: factory
    mode: "0700"
  loop:
    - supervisor

- name: Create the tmpfs isolated-child staging root
  ansible.builtin.file:
    path: /run/patchyard-children
    state: directory
    owner: "{{ factory_manager_user }}"
    group: "{{ factory_manager_user }}"
    mode: "0700"
  tags: [session13]

- name: Recreate the isolated-child staging root after boot
  ansible.builtin.copy:
    dest: /etc/tmpfiles.d/patchyard-children.conf
    content: |
      d /run/patchyard-children 0700 {{ factory_manager_user }} {{ factory_manager_user }} -
      d /run/netns 0755 root root -

    owner: root
    group: root
    mode: "0644"
  tags: [session13]

- name: Create the runtime network-namespace root
  ansible.builtin.file:
    path: /run/netns
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags: [session13]

- name: Create the per-child network-namespace configuration root
  ansible.builtin.file:
    path: /etc/netns
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags: [session13]

- name: Create dashboard-writable intake spool
  ansible.builtin.file:
    path: /var/lib/patchyard/spool
    state: directory
    owner: factory-web
    group: factory-web
    mode: "0700"

- name: Create the parity snapshot artifact root
  ansible.builtin.file:
    path: /var/lib/patchyard/snapshots
    state: directory
    owner: "{{ factory_manager_user }}"
    group: factory
    mode: "0700"

- name: Create the installed snapshot desired-state directory
  ansible.builtin.file:
    path: /usr/local/share/patchyard-worker/snapshot
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install the parity snapshot desired-state inputs
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../worker/snapshot/{{ item }}"
    dest: "/usr/local/share/patchyard-worker/snapshot/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - lineage.json
    - seed.sql

- name: Install the parity snapshot policy
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../policy/snapshot-policy.json"
    dest: /usr/local/share/patchyard-worker/snapshot/snapshot-policy.json
    owner: root
    group: root
    mode: "0644"

- name: Install parity snapshot operations
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../worker/snapshot/{{ item }}"
    dest: "/usr/local/sbin/{{ item }}"
    owner: root
    group: root
    mode: "0755"
  loop:
    - build-redacted-snapshot
    - check-snapshot-eligibility

- name: Install the parity snapshot freshness metric generator
  ansible.builtin.copy:
    src: patchyard-snapshot-metric
    dest: /usr/local/sbin/patchyard-snapshot-metric
    owner: root
    group: root
    mode: "0755"

- name: Install parity snapshot freshness metric units
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - patchyard-snapshot-metric.service
    - patchyard-snapshot-metric.timer

- name: Enable the parity snapshot freshness metric timer
  ansible.builtin.systemd:
    name: patchyard-snapshot-metric.timer
    enabled: true
    state: started
    daemon_reload: true

- name: Publish the initial parity snapshot freshness metric
  ansible.builtin.systemd:
    name: patchyard-snapshot-metric.service
    state: started
  changed_when: false

- name: Check whether PostgreSQL is initialized
  ansible.builtin.stat:
    path: /var/lib/pgsql/data/PG_VERSION
  register: postgresql_initialized

- name: Initialize the PostgreSQL data directory
  ansible.builtin.command:
    argv:
      - postgresql-setup
      - --initdb
      - --unit
      - postgresql
  when: not postgresql_initialized.stat.exists
  changed_when: true

- name: Create the restricted PostgreSQL runtime socket via tmpfiles
  ansible.builtin.copy:
    dest: /etc/tmpfiles.d/patchyard-postgresql.conf
    content: "d {{ postgresql_socket_directory }} 0770 postgres factory -\n"
    owner: root
    group: root
    mode: "0644"

- name: Read local SELinux file-context overrides
  ansible.builtin.command:
    argv:
      - semanage
      - fcontext
      - --list
      - --locallist
  register: postgresql_local_fcontexts
  changed_when: false

- name: Register the PostgreSQL socket SELinux context
  ansible.builtin.command:
    argv:
      - semanage
      - fcontext
      - --add
      - --type
      - postgresql_var_run_t
      - "{{ postgresql_socket_directory | regex_replace('^/run', '/var/run') }}(/.*)?"
  when: >-
    postgresql_local_fcontexts.stdout_lines
    | select(
        'search',
        (postgresql_socket_directory | regex_replace('^/run', '/var/run'))
        | regex_escape
      )
    | list
    | length == 0
  changed_when: true

- name: Correct the PostgreSQL socket SELinux context
  ansible.builtin.command:
    argv:
      - semanage
      - fcontext
      - --modify
      - --type
      - postgresql_var_run_t
      - "{{ postgresql_socket_directory | regex_replace('^/run', '/var/run') }}(/.*)?"
  when: >-
    postgresql_local_fcontexts.stdout_lines
    | select(
        'search',
        (postgresql_socket_directory | regex_replace('^/run', '/var/run'))
        | regex_escape
      )
    | reject('search', 'postgresql_var_run_t')
    | list
    | length > 0
  changed_when: true

- name: Materialize the restricted PostgreSQL runtime socket directory
  ansible.builtin.command:
    argv:
      - systemd-tmpfiles
      - --create
      - /etc/tmpfiles.d/patchyard-postgresql.conf
  changed_when: false

- name: Apply the PostgreSQL socket SELinux context
  ansible.builtin.command:
    argv:
      - restorecon
      - -RFv
      - "{{ postgresql_socket_directory }}"
  register: postgresql_socket_restorecon
  changed_when: "'Relabeled' in postgresql_socket_restorecon.stdout"

- name: Create the PostgreSQL TLS directory
  ansible.builtin.file:
    path: "{{ postgresql_tls_directory }}"
    state: directory
    owner: postgres
    group: postgres
    mode: "0700"

- name: Check the PostgreSQL TLS certificate renewal window
  ansible.builtin.command:
    argv:
      - openssl
      - x509
      - -checkend
      - "{{ postgresql_tls_renewal_window_seconds | string }}"
      - -noout
      - -in
      - "{{ postgresql_tls_directory }}/server.crt"
  register: postgresql_tls_current
  changed_when: false
  failed_when: false

- name: Generate a host-local PostgreSQL TLS key and self-signed trust root
  ansible.builtin.command:
    argv:
      - openssl
      - req
      - -x509
      - -newkey
      - rsa:3072
      - -sha256
      - -nodes
      - -days
      - "397"
      - -subj
      - /CN=factory-control.example.com
      - -addext
      - "subjectAltName=DNS:factory-control.example.com,IP:{{ private_ip }}"
      - -keyout
      - "{{ postgresql_tls_directory }}/server.key"
      - -out
      - "{{ postgresql_tls_directory }}/server.crt"
  become: true
  become_user: postgres
  no_log: true
  when: postgresql_tls_current.rc != 0
  changed_when: true
  notify: Restart PostgreSQL

- name: Enforce PostgreSQL TLS key permissions
  ansible.builtin.file:
    path: "{{ postgresql_tls_directory }}/server.key"
    owner: postgres
    group: postgres
    mode: "0600"

- name: Enforce PostgreSQL TLS certificate permissions
  ansible.builtin.file:
    path: "{{ postgresql_tls_directory }}/server.crt"
    owner: postgres
    group: postgres
    mode: "0644"

- name: Create the public database trust-root directory
  ansible.builtin.file:
    path: /etc/patchyard
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Publish the non-secret PostgreSQL TLS trust root
  ansible.builtin.copy:
    src: "{{ postgresql_tls_directory }}/server.crt"
    dest: /etc/patchyard/postgresql-server-ca.crt
    remote_src: true
    owner: root
    group: root
    mode: "0644"

- name: Install PostgreSQL desired-state configuration
  ansible.builtin.template:
    src: "{{ item.source }}"
    dest: "/var/lib/pgsql/data/{{ item.destination }}"
    owner: postgres
    group: postgres
    mode: "0600"
  loop:
    - source: postgresql.conf.j2
      destination: postgresql.conf
    - source: pg_hba.conf.j2
      destination: pg_hba.conf
    - source: pg_ident.conf.j2
      destination: pg_ident.conf
  notify: Restart PostgreSQL

- name: Enable PostgreSQL
  ansible.builtin.systemd:
    name: postgresql.service
    enabled: true
    state: started
    daemon_reload: true

- name: Apply pending PostgreSQL restarts before database provisioning
  ansible.builtin.meta: flush_handlers

- name: Verify the exact PostgreSQL server version
  ansible.builtin.command:
    argv:
      - postgres
      - --version
  register: postgresql_version_output
  changed_when: false
  failed_when: >-
    (postgresql_version_output.stdout | trim)
    != ('postgres (PostgreSQL) ' ~ (postgresql_version | string))

- name: Create the PostgreSQL desired-state SQL directory
  ansible.builtin.file:
    path: /usr/local/share/patchyard/postgresql
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags: [session13]

- name: Install declarative PostgreSQL role and grant definitions
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/usr/local/share/patchyard/postgresql/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - postgresql-roles.sql
    - postgresql-grants.sql
  tags: [session13]

- name: Apply declarative PostgreSQL roles
  ansible.builtin.command:
    argv:
      - psql
      - "--host={{ postgresql_socket_directory }}"
      - --dbname=postgres
      - --set=ON_ERROR_STOP=1
      - --file=/usr/local/share/patchyard/postgresql/postgresql-roles.sql
  become: true
  become_user: postgres
  changed_when: false

- name: Check for the factory database
  ansible.builtin.command:
    argv:
      - psql
      - "--host={{ postgresql_socket_directory }}"
      - --dbname=postgres
      - --tuples-only
      - --no-align
      - --command=SELECT 1 FROM pg_database WHERE datname = 'patchyard'
  become: true
  become_user: postgres
  register: factory_database_exists
  changed_when: false

- name: Create the factory database under the schema owner
  ansible.builtin.command:
    argv:
      - createdb
      - "--host={{ postgresql_socket_directory }}"
      - --owner=patchyard_owner
      - patchyard
  become: true
  become_user: postgres
  when: factory_database_exists.stdout | trim != '1'
  changed_when: true

- name: Make migrations assume the non-login schema owner
  ansible.builtin.command:
    argv:
      - psql
      - "--host={{ postgresql_socket_directory }}"
      - --dbname=patchyard
      - --set=ON_ERROR_STOP=1
      - --command=ALTER ROLE patchyard_migrator IN DATABASE patchyard SET role TO patchyard_owner
  become: true
  become_user: postgres
  changed_when: false

- name: Require the reviewed factoryctl build artifact
  ansible.builtin.assert:
    that:
      - factoryctl_binary is defined
      - factoryctl_binary | length > 0
      - factoryctl_sha256 is defined
      - factoryctl_sha256 is match('^[0-9a-f]{64}$')
    fail_msg: "Use converge.sh so migrations run from the reviewed, locked Rust build."
  tags: [session13]

- name: Hash the local factoryctl build artifact
  ansible.builtin.stat:
    path: "{{ factoryctl_binary }}"
    checksum_algorithm: sha256
  delegate_to: localhost
  become: false
  register: local_factoryctl
  tags: [session13]

- name: Require the exact factoryctl build artifact
  ansible.builtin.assert:
    that:
      - local_factoryctl.stat.exists
      - local_factoryctl.stat.checksum == factoryctl_sha256
    fail_msg: "factoryctl changed after converge.sh built and hashed it."
  tags: [session13]

- name: Install the reviewed factoryctl binary
  ansible.builtin.copy:
    src: "{{ factoryctl_binary }}"
    dest: /usr/local/bin/factoryctl
    owner: root
    group: root
    mode: "0755"
  register: factoryctl_install
  tags: [session13]

- name: Require the reviewed factory-supervisor build artifact
  ansible.builtin.assert:
    that:
      - factory_supervisor_binary is defined
      - factory_supervisor_binary | length > 0
      - factory_supervisor_sha256 is defined
      - factory_supervisor_sha256 is match('^[0-9a-f]{64}$')
  tags: [session13]

- name: Hash the local factory-supervisor build artifact
  ansible.builtin.stat:
    path: "{{ factory_supervisor_binary }}"
    checksum_algorithm: sha256
  delegate_to: localhost
  become: false
  register: local_factory_supervisor
  tags: [session13]

- name: Require the exact factory-supervisor build artifact
  ansible.builtin.assert:
    that:
      - local_factory_supervisor.stat.exists
      - local_factory_supervisor.stat.checksum == factory_supervisor_sha256
  tags: [session13]

- name: Install the reviewed factory-supervisor binary
  ansible.builtin.copy:
    src: "{{ factory_supervisor_binary }}"
    dest: /usr/local/bin/factory-supervisor
    owner: root
    group: root
    mode: "0755"
  notify: Restart factory supervisor
  tags: [session13]

- name: Require the reviewed evidence qualification build artifact
  ansible.builtin.assert:
    that:
      - factory_evidence_qualify_binary is defined
      - factory_evidence_qualify_binary | length > 0
      - factory_evidence_qualify_sha256 is defined
      - factory_evidence_qualify_sha256 is match('^[0-9a-f]{64}$')
  tags: [session13]

- name: Hash the local evidence qualification build artifact
  ansible.builtin.stat:
    path: "{{ factory_evidence_qualify_binary }}"
    checksum_algorithm: sha256
  delegate_to: localhost
  become: false
  register: local_factory_evidence_qualify
  tags: [session13]

- name: Require the exact evidence qualification build artifact
  ansible.builtin.assert:
    that:
      - local_factory_evidence_qualify.stat.exists
      - local_factory_evidence_qualify.stat.checksum == factory_evidence_qualify_sha256
  tags: [session13]

- name: Require the reviewed factory-web build artifact
  ansible.builtin.assert:
    that:
      - factory_web_binary is defined
      - factory_web_binary | length > 0
      - factory_web_sha256 is defined
      - factory_web_sha256 is match('^[0-9a-f]{64}$')

- name: Hash the local factory-web build artifact
  ansible.builtin.stat:
    path: "{{ factory_web_binary }}"
    checksum_algorithm: sha256
  delegate_to: localhost
  become: false
  register: local_factory_web

- name: Require the exact factory-web build artifact
  ansible.builtin.assert:
    that:
      - local_factory_web.stat.exists
      - local_factory_web.stat.checksum == factory_web_sha256

- name: Install the reviewed factory-web binary
  ansible.builtin.copy:
    src: "{{ factory_web_binary }}"
    dest: /usr/local/bin/factory-web
    owner: root
    group: root
    mode: "0755"
  notify: Restart factory dashboard

- name: Require the reviewed factory-verify build artifact
  ansible.builtin.assert:
    that:
      - factory_verify_binary is defined
      - factory_verify_binary | length > 0
      - factory_verify_sha256 is defined
      - factory_verify_sha256 is match('^[0-9a-f]{64}$')

- name: Hash the local factory-verify build artifact
  ansible.builtin.stat:
    path: "{{ factory_verify_binary }}"
    checksum_algorithm: sha256
  delegate_to: localhost
  become: false
  register: local_factory_verify

- name: Require the exact factory-verify build artifact
  ansible.builtin.assert:
    that:
      - local_factory_verify.stat.exists
      - local_factory_verify.stat.checksum == factory_verify_sha256

- name: Install the reviewed factory-verify binary on the control plane
  ansible.builtin.copy:
    src: "{{ factory_verify_binary }}"
    dest: /usr/local/bin/factory-verify
    owner: root
    group: root
    mode: "0755"

- name: Count applied SQLx migrations before convergence
  ansible.builtin.command:
    argv:
      - psql
      - "--host={{ postgresql_socket_directory }}"
      - --dbname=patchyard
      - --tuples-only
      - --no-align
      - --command=SELECT count(*) FROM public._sqlx_migrations WHERE success
  become: true
  become_user: postgres
  register: migration_count_before
  changed_when: false
  failed_when: false
  tags: [session13]

- name: Apply embedded SQLx migrations through the peer-mapped migrator
  ansible.builtin.command:
    argv:
      - /usr/local/bin/factoryctl
      - migrate
  become: true
  become_user: "{{ factory_manager_user }}"
  environment:
    DATABASE_URL: >-
      postgresql:///patchyard?host={{ postgresql_socket_directory }}&user=patchyard_migrator&sslmode=disable
  register: migration_apply
  changed_when: >-
    migration_count_before.rc != 0
    or (migration_count_before.stdout | trim | int) < factory_migration_count
  tags: [session13]

- name: Assert the canonical migration count
  ansible.builtin.command:
    argv:
      - psql
      - "--host={{ postgresql_socket_directory }}"
      - --dbname=patchyard
      - --tuples-only
      - --no-align
      - --command=SELECT count(*) FROM public._sqlx_migrations WHERE success
  become: true
  become_user: postgres
  register: migration_count_after
  changed_when: false
  failed_when: migration_count_after.stdout | trim | int != factory_migration_count
  tags: [session13]

- name: Apply the complete runtime role grant matrix
  ansible.builtin.command:
    argv:
      - psql
      - "--host={{ postgresql_socket_directory }}"
      - --dbname=patchyard
      - --set=ON_ERROR_STOP=1
      - --file=/usr/local/share/patchyard/postgresql/postgresql-grants.sql
  become: true
  become_user: postgres
  changed_when: false
  tags: [session13]

- name: Load bootstrap dashboard accounts from the controller secret file
  ansible.builtin.set_fact:
    factory_dashboard_accounts: >-
      {{ lookup('ansible.builtin.file', factory_dashboard_accounts_file) | from_json }}
  no_log: true

- name: Require the ruled Git-controlled dashboard identity roster
  ansible.builtin.assert:
    that:
      - factory_dashboard_account_identities is sequence
      - factory_dashboard_account_identities | length >= 3
      - >-
        factory_dashboard_account_identities
        | map(attribute='username')
        | unique
        | list
        | length == (factory_dashboard_account_identities | length)
      - factory_dashboard_account_identities | selectattr('role', 'equalto', 'factory_admin') | list | length >= 2
      - factory_dashboard_account_identities | selectattr('role', 'equalto', 'factory_submit') | list | length >= 1
    fail_msg: >-
      A69 requires bootstrap identities and roles in Git. Resolve the
      Session 11 submit-only identity escalation before convergence.

- name: Validate each Git-controlled dashboard identity
  ansible.builtin.assert:
    that:
      - item.username is string
      - item.display_name is string
      - item.role in ['factory_submit', 'factory_admin']
  loop: "{{ factory_dashboard_account_identities }}"

- name: Require owner, engineering, and submitter bootstrap identities
  ansible.builtin.assert:
    that:
      - factory_dashboard_accounts is sequence
      - factory_dashboard_accounts | length == factory_dashboard_account_identities | length
      - >-
        factory_dashboard_accounts
        | map(attribute='username')
        | unique
        | list
        | length == (factory_dashboard_accounts | length)
      - item.username is string
      - item.display_name is string
      - item.password is string
      - item.password | length >= 14
      - item.role in ['factory_submit', 'factory_admin']
      - >-
        factory_dashboard_account_identities
        | selectattr('username', 'equalto', item.username)
        | selectattr('display_name', 'equalto', item.display_name)
        | selectattr('role', 'equalto', item.role)
        | list
        | length == 1
  loop: "{{ factory_dashboard_accounts }}"
  no_log: true

