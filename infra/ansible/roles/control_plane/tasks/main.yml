      - /etc/tmpfiles.d/patchyard-session14-qualification.conf
  changed_when: false
  tags: [session14]

- name: Reload systemd for the Session 14 lifecycle qualification unit
  ansible.builtin.systemd:
    daemon_reload: true
  tags: [session14]

- name: Qualify the converged Session 14 control-plane boundary
  ansible.builtin.command:
    argv:
      - /usr/local/sbin/qualify-factory-session14
      - "{{ factory_repo_revision }}"
  changed_when: false
  tags: [session14]

- name: Publish the expected PHPUnit checksum to the verifier coordinator
  ansible.builtin.copy:
    dest: /usr/local/share/patchyard/phpunit.sha256
    content: "{{ phpunit_sha256 }}\n"
    owner: root
    group: root
    mode: "0644"

- name: Remove the transferred repository bundle
  ansible.builtin.file:
    path: /var/tmp/patchyard.bundle
    state: absent
  when: installed_factory_revision.stdout != factory_repo_revision
  tags: [session13]
