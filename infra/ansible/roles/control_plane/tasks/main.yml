---
- name: Install EPEL for headless Chromium
  ansible.builtin.dnf:
    name: epel-release
    state: present

- name: Install control-plane packages
  ansible.builtin.dnf:
    name:
      - chromium
      - fontconfig
      - policycoreutils-python-utils
      - python3-pip
    state: present

- name: Create the factory-owned Ansible desired-state directory
  ansible.builtin.file:
    path: /usr/local/share/patchyard/ansible
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install the pinned Ansible controller manifests
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/{{ item }}"
    dest: "/usr/local/share/patchyard/ansible/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - requirements.txt
    - requirements.yml

- name: Install the pinned control-plane Ansible environment
  ansible.builtin.pip:
    requirements: /usr/local/share/patchyard/ansible/requirements.txt
    virtualenv: /opt/patchyard-ansible
    virtualenv_command: /usr/bin/python3 -m venv

- name: Inspect the installed ansible.posix collection
  ansible.builtin.command:
    argv:
      - /opt/patchyard-ansible/bin/ansible-galaxy
      - collection
      - list
      - ansible.posix
  environment:
    ANSIBLE_COLLECTIONS_PATH: /opt/patchyard-ansible/collections
  register: factory_ansible_posix_collection
  changed_when: false
  failed_when: false

- name: Install the pinned ansible.posix collection
  ansible.builtin.command:
    argv:
      - /opt/patchyard-ansible/bin/ansible-galaxy
      - collection
      - install
      - --collections-path
      - /opt/patchyard-ansible/collections
      - --requirements-file
      - /usr/local/share/patchyard/ansible/requirements.yml
  when: "'ansible.posix 1.5.4' not in factory_ansible_posix_collection.stdout"
  changed_when: true

- name: Create the factory service group
  ansible.builtin.group:
    name: factory
    system: true

- name: Enable the pinned PostgreSQL AppStream server profile
  ansible.builtin.dnf:
    name: "@postgresql:{{ postgresql_stream }}/server"
    state: present

- name: Install the exact reviewed PostgreSQL packages
  ansible.builtin.dnf:
    name:
      - "postgresql-{{ postgresql_version }}-{{ postgresql_package_release }}"
      - "postgresql-contrib-{{ postgresql_version }}-{{ postgresql_package_release }}"
      - "postgresql-server-{{ postgresql_version }}-{{ postgresql_package_release }}"
    state: present
    allow_downgrade: true

- name: Give PostgreSQL permission to own the restricted socket group
  ansible.builtin.user:
    name: postgres
    groups:
      - factory
    append: true
  notify: Restart PostgreSQL

- name: Give the exporter access to the restricted database socket
  ansible.builtin.user:
    name: postgres_exporter
    groups:
      - factory
    append: true
  notify: Restart control-plane exporters

- name: Allow the factory management identity to traverse factory-owned state
  ansible.builtin.user:
    name: "{{ factory_manager_user }}"
    groups:
      - factory
    append: true

- name: Create the dashboard service identity
  ansible.builtin.user:
    name: factory-web
    comment: Patchyard Factory dashboard service
    create_home: false
    group: factory
    home: /var/lib/patchyard
    password_lock: true
    shell: /usr/sbin/nologin
    system: true

- name: Create the factory state root
  ansible.builtin.file:
    path: /var/lib/patchyard
    state: directory
    owner: root
    group: factory
    mode: "0750"

- name: Create dashboard-writable factory state directories
  ansible.builtin.file:
    path: "/var/lib/patchyard/{{ item }}"
    state: directory
    owner: factory-web
    group: factory
    mode: "0700"
  loop:
    - artifacts
    - spool

- name: Check whether PostgreSQL is initialized
  ansible.builtin.stat:
    path: /var/lib/pgsql/data/PG_VERSION
  register: postgresql_initialized

- name: Initialize the PostgreSQL data directory
  ansible.builtin.command:
    argv:
      - postgresql-setup
      - --initdb
      - --unit
      - postgresql
  when: not postgresql_initialized.stat.exists
  changed_when: true

- name: Create the restricted PostgreSQL runtime socket via tmpfiles
  ansible.builtin.copy:
    dest: /etc/tmpfiles.d/patchyard-postgresql.conf
    content: "d {{ postgresql_socket_directory }} 0770 postgres factory -\n"
    owner: root
    group: root
    mode: "0644"

- name: Read local SELinux file-context overrides
  ansible.builtin.command:
    argv:
      - semanage
      - fcontext
      - --list
      - --locallist
  register: postgresql_local_fcontexts
  changed_when: false

- name: Register the PostgreSQL socket SELinux context
  ansible.builtin.command:
    argv:
      - semanage
      - fcontext
      - --add
      - --type
      - postgresql_var_run_t
      - "{{ postgresql_socket_directory | regex_replace('^/run', '/var/run') }}(/.*)?"
  when: >-
    postgresql_local_fcontexts.stdout_lines
    | select(
        'search',
        (postgresql_socket_directory | regex_replace('^/run', '/var/run'))
        | regex_escape
      )
    | list
    | length == 0
  changed_when: true

- name: Correct the PostgreSQL socket SELinux context
  ansible.builtin.command:
    argv:
      - semanage
      - fcontext
      - --modify
      - --type
      - postgresql_var_run_t
      - "{{ postgresql_socket_directory | regex_replace('^/run', '/var/run') }}(/.*)?"
  when: >-
    postgresql_local_fcontexts.stdout_lines
    | select(
        'search',
        (postgresql_socket_directory | regex_replace('^/run', '/var/run'))
        | regex_escape
      )
    | reject('search', 'postgresql_var_run_t')
    | list
    | length > 0
  changed_when: true

- name: Materialize the restricted PostgreSQL runtime socket directory
  ansible.builtin.command:
    argv:
      - systemd-tmpfiles
      - --create
      - /etc/tmpfiles.d/patchyard-postgresql.conf
  changed_when: false

- name: Apply the PostgreSQL socket SELinux context
  ansible.builtin.command:
    argv:
      - restorecon
      - -RFv
      - "{{ postgresql_socket_directory }}"
  register: postgresql_socket_restorecon
  changed_when: "'Relabeled' in postgresql_socket_restorecon.stdout"

- name: Create the PostgreSQL TLS directory
  ansible.builtin.file:
    path: "{{ postgresql_tls_directory }}"
    state: directory
    owner: postgres
    group: postgres
    mode: "0700"

- name: Check the PostgreSQL TLS certificate renewal window
  ansible.builtin.command:
    argv:
      - openssl
      - x509
      - -checkend
      - "{{ postgresql_tls_renewal_window_seconds | string }}"
      - -noout
      - -in
      - "{{ postgresql_tls_directory }}/server.crt"
  register: postgresql_tls_current
  changed_when: false
  failed_when: false

- name: Generate a host-local PostgreSQL TLS key and self-signed trust root
  ansible.builtin.command:
    argv:
      - openssl
      - req
      - -x509
      - -newkey
      - rsa:3072
      - -sha256
      - -nodes
      - -days
      - "397"
      - -subj
      - /CN=factory-control.example.com
      - -addext
      - "subjectAltName=DNS:factory-control.example.com,IP:{{ private_ip }}"
      - -keyout
      - "{{ postgresql_tls_directory }}/server.key"
      - -out
      - "{{ postgresql_tls_directory }}/server.crt"
  become: true
  become_user: postgres
  no_log: true
  when: postgresql_tls_current.rc != 0
  changed_when: true
  notify: Restart PostgreSQL

- name: Enforce PostgreSQL TLS key permissions
  ansible.builtin.file:
    path: "{{ postgresql_tls_directory }}/server.key"
    owner: postgres
    group: postgres
    mode: "0600"

- name: Enforce PostgreSQL TLS certificate permissions
  ansible.builtin.file:
    path: "{{ postgresql_tls_directory }}/server.crt"
    owner: postgres
    group: postgres
    mode: "0644"

- name: Create the public database trust-root directory
  ansible.builtin.file:
    path: /etc/patchyard
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Publish the non-secret PostgreSQL TLS trust root
  ansible.builtin.copy:
    src: "{{ postgresql_tls_directory }}/server.crt"
    dest: /etc/patchyard/postgresql-server-ca.crt
    remote_src: true
    owner: root
    group: root
    mode: "0644"

- name: Install PostgreSQL desired-state configuration
  ansible.builtin.template:
    src: "{{ item.source }}"
    dest: "/var/lib/pgsql/data/{{ item.destination }}"
    owner: postgres
    group: postgres
    mode: "0600"
  loop:
    - source: postgresql.conf.j2
      destination: postgresql.conf
    - source: pg_hba.conf.j2
      destination: pg_hba.conf
    - source: pg_ident.conf.j2
      destination: pg_ident.conf
  notify: Restart PostgreSQL

- name: Enable PostgreSQL
  ansible.builtin.systemd:
    name: postgresql.service
    enabled: true
    state: started
    daemon_reload: true

- name: Apply pending PostgreSQL restarts before database provisioning
  ansible.builtin.meta: flush_handlers

- name: Verify the exact PostgreSQL server version
  ansible.builtin.command:
    argv:
      - postgres
      - --version
  register: postgresql_version_output
  changed_when: false
  failed_when: >-
    (postgresql_version_output.stdout | trim)
    != ('postgres (PostgreSQL) ' ~ (postgresql_version | string))

- name: Create the PostgreSQL desired-state SQL directory
  ansible.builtin.file:
    path: /usr/local/share/patchyard/postgresql
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install declarative PostgreSQL role and grant definitions
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/usr/local/share/patchyard/postgresql/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - postgresql-roles.sql
    - postgresql-grants.sql

- name: Apply declarative PostgreSQL roles
  ansible.builtin.command:
    argv:
      - psql
      - "--host={{ postgresql_socket_directory }}"
      - --dbname=postgres
      - --set=ON_ERROR_STOP=1
      - --file=/usr/local/share/patchyard/postgresql/postgresql-roles.sql
  become: true
  become_user: postgres
  changed_when: false

- name: Check for the factory database
  ansible.builtin.command:
    argv:
      - psql
      - "--host={{ postgresql_socket_directory }}"
      - --dbname=postgres
      - --tuples-only
      - --no-align
      - --command=SELECT 1 FROM pg_database WHERE datname = 'patchyard'
  become: true
  become_user: postgres
  register: factory_database_exists
  changed_when: false

- name: Create the factory database under the schema owner
  ansible.builtin.command:
    argv:
      - createdb
      - "--host={{ postgresql_socket_directory }}"
      - --owner=patchyard_owner
      - patchyard
  become: true
  become_user: postgres
  when: factory_database_exists.stdout | trim != '1'
  changed_when: true

- name: Make migrations assume the non-login schema owner
  ansible.builtin.command:
    argv:
      - psql
      - "--host={{ postgresql_socket_directory }}"
      - --dbname=patchyard
      - --set=ON_ERROR_STOP=1
      - --command=ALTER ROLE patchyard_migrator IN DATABASE patchyard SET role TO patchyard_owner
  become: true
  become_user: postgres
  changed_when: false

- name: Require the reviewed factoryctl build artifact
  ansible.builtin.assert:
    that:
      - factoryctl_binary is defined
      - factoryctl_binary | length > 0
      - factoryctl_sha256 is defined
      - factoryctl_sha256 is match('^[0-9a-f]{64}$')
    fail_msg: "Use converge.sh so migrations run from the reviewed, locked Rust build."

- name: Hash the local factoryctl build artifact
  ansible.builtin.stat:
    path: "{{ factoryctl_binary }}"
    checksum_algorithm: sha256
  delegate_to: localhost
  become: false
  register: local_factoryctl

- name: Require the exact factoryctl build artifact
  ansible.builtin.assert:
    that:
      - local_factoryctl.stat.exists
      - local_factoryctl.stat.checksum == factoryctl_sha256
    fail_msg: "factoryctl changed after converge.sh built and hashed it."

- name: Install the reviewed factoryctl binary
  ansible.builtin.copy:
    src: "{{ factoryctl_binary }}"
    dest: /usr/local/bin/factoryctl
    owner: root
    group: root
    mode: "0755"
  register: factoryctl_install

- name: Count applied SQLx migrations before convergence
  ansible.builtin.command:
    argv:
      - psql
      - "--host={{ postgresql_socket_directory }}"
      - --dbname=patchyard
      - --tuples-only
      - --no-align
      - --command=SELECT count(*) FROM public._sqlx_migrations WHERE success
  become: true
  become_user: postgres
  register: migration_count_before
  changed_when: false
  failed_when: false

- name: Apply embedded SQLx migrations through the peer-mapped migrator
  ansible.builtin.command:
    argv:
      - /usr/local/bin/factoryctl
      - migrate
  become: true
  become_user: "{{ factory_manager_user }}"
  environment:
    DATABASE_URL: >-
      postgresql:///patchyard?host={{ postgresql_socket_directory }}&user=patchyard_migrator&sslmode=disable
  register: migration_apply
  changed_when: >-
    migration_count_before.rc != 0
    or (migration_count_before.stdout | trim | int) < factory_migration_count

- name: Assert the canonical migration count
  ansible.builtin.command:
    argv:
      - psql
      - "--host={{ postgresql_socket_directory }}"
      - --dbname=patchyard
      - --tuples-only
      - --no-align
      - --command=SELECT count(*) FROM public._sqlx_migrations WHERE success
  become: true
  become_user: postgres
  register: migration_count_after
  changed_when: false
  failed_when: migration_count_after.stdout | trim | int != factory_migration_count

- name: Apply the complete runtime role grant matrix
  ansible.builtin.command:
    argv:
      - psql
      - "--host={{ postgresql_socket_directory }}"
      - --dbname=patchyard
      - --set=ON_ERROR_STOP=1
      - --file=/usr/local/share/patchyard/postgresql/postgresql-grants.sql
  become: true
  become_user: postgres
  changed_when: false

- name: Install PostgreSQL TLS expiry metric generator
  ansible.builtin.template:
    src: postgresql-tls-expiry-metric.sh.j2
    dest: /usr/local/sbin/patchyard-postgresql-tls-metric
    owner: root
    group: root
    mode: "0755"

- name: Install PostgreSQL TLS expiry metric units
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - patchyard-postgresql-tls-metric.service
    - patchyard-postgresql-tls-metric.timer

- name: Enable the PostgreSQL TLS expiry metric timer
  ansible.builtin.systemd:
    name: patchyard-postgresql-tls-metric.timer
    enabled: true
    state: started
    daemon_reload: true

- name: Publish the initial PostgreSQL TLS expiry metric
  ansible.builtin.systemd:
    name: patchyard-postgresql-tls-metric.service
    state: started
  changed_when: false

- name: Restart exporters after socket and metric configuration
  ansible.builtin.meta: flush_handlers

- name: Start the PostgreSQL exporter against the peer socket
  ansible.builtin.systemd:
    name: postgres-exporter.service
    enabled: true
    state: started
    daemon_reload: true

- name: Create the publisher worktree root
  ansible.builtin.file:
    path: /var/lib/patchyard/worktrees
    state: directory
    owner: "{{ factory_manager_user }}"
    group: factory
    mode: "0750"

- name: Create Caddy service identity
  ansible.builtin.user:
    name: caddy
    comment: Caddy web server
    create_home: false
    home: /var/lib/caddy
    password_lock: true
    shell: /usr/sbin/nologin
    system: true

- name: Download pinned Caddy
  ansible.builtin.get_url:
    url: "https://github.com/caddyserver/caddy/releases/download/v{{ caddy_version }}/caddy_{{ caddy_version }}_linux_amd64.tar.gz"
    dest: "/var/cache/caddy-{{ caddy_version }}.tar.gz"
    checksum: "sha512:{{ caddy_sha512 }}"
    owner: root
    group: root
    mode: "0644"

- name: Create versioned Caddy directory
  ansible.builtin.file:
    path: "/opt/patchyard-tools/caddy-{{ caddy_version }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Unpack pinned Caddy
  ansible.builtin.unarchive:
    src: "/var/cache/caddy-{{ caddy_version }}.tar.gz"
    dest: "/opt/patchyard-tools/caddy-{{ caddy_version }}"
    remote_src: true
    creates: "/opt/patchyard-tools/caddy-{{ caddy_version }}/caddy"

- name: Link Caddy into the executable path
  ansible.builtin.file:
    src: "/opt/patchyard-tools/caddy-{{ caddy_version }}/caddy"
    dest: /usr/local/bin/caddy
    state: link
    force: true
    owner: root
    group: root

- name: Install control-plane qualification probe
  ansible.builtin.copy:
    src: qualify-factory-control
    dest: /usr/local/sbin/qualify-factory-control
    owner: root
    group: root
    mode: "0755"

- name: Require a credential-free repository bundle
  ansible.builtin.assert:
    that:
      - factory_repo_bundle is defined
      - factory_repo_bundle | length > 0
      - factory_repo_revision is defined
      - factory_repo_revision is match('^[0-9a-f]{40}$')
    fail_msg: "Use converge.sh so the control plane receives an exact Git bundle and revision."

- name: Inspect the control-plane checkout
  ansible.builtin.stat:
    path: /opt/patchyard/.git
  register: factory_checkout

- name: Read the installed desired-state revision
  ansible.builtin.command:
    argv:
      - git
      - -C
      - /opt/patchyard
      - rev-parse
      - HEAD
  register: installed_factory_revision
  become: true
  become_user: "{{ factory_manager_user }}"
  changed_when: false
  failed_when: false

- name: Create the credential-free checkout root
  ansible.builtin.file:
    path: /opt/patchyard
    state: directory
    owner: "{{ factory_manager_user }}"
    group: "{{ factory_manager_user }}"
    mode: "0750"
  when: not factory_checkout.stat.exists

- name: Copy the bundle only when the checkout needs an update
  ansible.builtin.copy:
    src: "{{ factory_repo_bundle }}"
    dest: /var/tmp/patchyard.bundle
    owner: "{{ factory_manager_user }}"
    group: "{{ factory_manager_user }}"
    mode: "0600"
  when: installed_factory_revision.stdout != factory_repo_revision

- name: Create the credential-free control-plane checkout
  ansible.builtin.command:
    argv:
      - git
      - -C
      - /opt/patchyard
      - clone
      - --no-checkout
      - /var/tmp/patchyard.bundle
      - .
  become: true
  become_user: "{{ factory_manager_user }}"
  changed_when: true
  when: not factory_checkout.stat.exists

- name: Fetch the exact desired state from the bundle
  ansible.builtin.command:
    argv:
      - git
      - -C
      - /opt/patchyard
      - fetch
      - /var/tmp/patchyard.bundle
      - "+{{ factory_repo_revision }}:refs/remotes/bootstrap/desired"
  become: true
  become_user: "{{ factory_manager_user }}"
  changed_when: false
  when: installed_factory_revision.stdout != factory_repo_revision

- name: Check out the exact desired-state revision
  ansible.builtin.command:
    argv:
      - git
      - -C
      - /opt/patchyard
      - checkout
      - --detach
      - --force
      - "{{ factory_repo_revision }}"
  become: true
  become_user: "{{ factory_manager_user }}"
  changed_when: true
  when: installed_factory_revision.stdout != factory_repo_revision

- name: Record the credential-free upstream URL
  ansible.builtin.command:
    argv:
      - git
      - -C
      - /opt/patchyard
      - remote
      - set-url
      - origin
      - https://github.com/JacobStephens2/patchyard.git
  become: true
  become_user: "{{ factory_manager_user }}"
  changed_when: false

- name: Install the private-VPC management inventory
  ansible.builtin.template:
    src: factory-management-inventory.yml.j2
    dest: /etc/patchyard/management-inventory.yml
    owner: root
    group: "{{ factory_manager_user }}"
    mode: "0640"

- name: Install the bounded private-VPC management transport
  ansible.builtin.template:
    src: patchyard-management-ssh.j2
    dest: /usr/local/sbin/patchyard-management-ssh
    owner: "{{ factory_manager_user }}"
    group: "{{ factory_manager_user }}"
    mode: "0750"

- name: Install the control-plane host convergence entry point
  ansible.builtin.copy:
    src: patchyard-converge-hosts
    dest: /usr/local/sbin/patchyard-converge-hosts
    owner: "{{ factory_manager_user }}"
    group: "{{ factory_manager_user }}"
    mode: "0750"

- name: Make the factory management identity owner of the checkout
  ansible.builtin.file:
    path: /opt/patchyard
    owner: "{{ factory_manager_user }}"
    group: "{{ factory_manager_user }}"
    recurse: true

- name: Remove the transferred repository bundle
  ansible.builtin.file:
    path: /var/tmp/patchyard.bundle
    state: absent
  when: installed_factory_revision.stdout != factory_repo_revision
