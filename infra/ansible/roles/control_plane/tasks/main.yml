  ansible.builtin.command:
    argv:
      - /usr/local/bin/factoryctl
      - account
      - provision
      - "--username={{ item.username }}"
      - "--display-name={{ item.display_name }}"
      - "--role={{ item.role | replace('_', '-') }}"
    stdin: "{{ item.password }}"
    stdin_add_newline: false
  become: true
  become_user: "{{ factory_manager_user }}"
  environment:
    DATABASE_URL: >-
      postgresql:///patchyard?host={{ postgresql_socket_directory }}&user=patchyard_migrator&sslmode=disable
  loop: "{{ factory_dashboard_accounts }}"
  no_log: true
  changed_when: false

