---
- name: Create the worker runtime group
  ansible.builtin.group:
    name: factory-worker
    system: true

- name: Install Firecracker image and runtime prerequisites
  ansible.builtin.dnf:
    name:
      - dnf-plugins-core
      - "{{ worker_e2fsprogs_nevra }}"
      - "{{ worker_e2fsprogs_libs_nevra }}"
      - gzip
      - "{{ worker_libcom_err_nevra }}"
      - openssl
      - procps-ng
      - util-linux
    state: present
    allow_downgrade: true

- name: Create the unprivileged worker identity
  ansible.builtin.user:
    name: factory-worker
    comment: Secret-free factory execution identity
    group: factory-worker
    create_home: true
    home: /var/lib/patchyard-worker
    password_lock: true
    shell: /bin/bash
    system: true

- name: Give the worker VMM access only to KVM
  ansible.builtin.user:
    name: factory-worker
    groups:
      - kvm
    append: true

- name: Restrict the worker home
  ansible.builtin.file:
    path: /var/lib/patchyard-worker
    state: directory
    owner: factory-worker
    group: factory-worker
    mode: "0700"

- name: Create worker desired-state and image directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop:
    - path: /usr/local/share/patchyard-worker/image
      mode: "0755"
    - path: /usr/local/share/patchyard-worker/snapshot
      mode: "0755"
    - path: /usr/local/share/patchyard-worker/probes
      mode: "0755"
    - path: /etc/patchyard-worker
      mode: "0755"
    - path: /opt/patchyard-worker/images
      mode: "0755"
    - path: /var/cache/patchyard-worker
      mode: "0755"

# Mode is deliberately unmanaged here: the source tree is a group-writable
# working copy (umask 002), so "mode: preserve" kept re-installing 0775 files
# that the pin task below reset to 0755 - a permanent changed=2 flap. Without
# "mode", copy manages content only for existing files; the pin task owns modes.
- name: Install the parity image recipe # noqa: risky-file-permissions (modes pinned by the task below)
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../worker/image/"
    dest: /usr/local/share/patchyard-worker/image/
    owner: root
    group: root

- name: Remove retired parity image recipe entries
  ansible.builtin.file:
    path: "/usr/local/share/patchyard-worker/image/{{ item }}"
    state: absent
  loop:
    - 10-eth0.network

- name: Pin parity image recipe modes
  ansible.builtin.file:
    path: "/usr/local/share/patchyard-worker/image/{{ item.name }}"
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop:
    - { name: build-parity-image, mode: "0755" }
    - { name: patchyard-guest-network, mode: "0755" }
    - { name: patchyard-guest-run, mode: "0755" }
    - { name: patchyard-hostile-probe, mode: "0755" }
    - { name: patchyard-toy-agent, mode: "0755" }
    - { name: e2fsprogs-packages.txt, mode: "0644" }
    - { name: patchyard-guest-run.service, mode: "0644" }
    - { name: patchyard-parity.conf, mode: "0644" }
    - { name: httpd-packages.txt, mode: "0644" }
    - { name: mysql-packages.txt, mode: "0644" }
    - { name: php-packages.txt, mode: "0644" }
    - { name: php-rpms.sha256, mode: "0644" }
    - { name: pins.env, mode: "0644" }
    - { name: production-parity.json, mode: "0644" }

- name: Install the unchanged Session 3 candidate probe
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../research/isolation/harness/candidate-probe.sh"
    dest: /usr/local/share/patchyard-worker/probes/candidate-probe.sh
    owner: root
    group: root
    mode: "0755"

- name: Install the provider egress policy
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../policy/provider-egress.json"
    dest: /etc/patchyard-worker/provider-egress.json
    owner: root
    group: root
    mode: "0644"

- name: Install the worker lifecycle policy
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../policy/worker-lifecycle.json"
    dest: /etc/patchyard-worker/worker-lifecycle.json
    owner: root
    group: root
    mode: "0644"

- name: Install the production Firecracker launcher
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../worker/runtime/patchyard-firecracker-run"
    dest: /usr/local/sbin/patchyard-firecracker-run
    owner: root
    group: root
    mode: "0750"

- name: Install the Anthropic one-shot provider transport
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../worker/runtime/patchyard-anthropic-one-shot"
    dest: /usr/local/libexec/patchyard-anthropic-one-shot
    owner: root
    group: root
    mode: "0750"

- name: Install the explicit supervisor worker-teardown operation
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../worker/runtime/patchyard-worker-teardown"
    dest: /usr/local/sbin/patchyard-worker-teardown
    owner: root
    group: root
    mode: "0750"

- name: Install the non-root guest-result extractor
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../worker/runtime/patchyard-extract-result-image"
    dest: /usr/local/libexec/patchyard-extract-result-image
    owner: root
    group: root
    mode: "0755"

- name: Create the hostile-qualification desired-state directory
  ansible.builtin.file:
    path: /usr/local/share/patchyard-worker/qualification
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install the hostile-test manifest
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../worker/qualification/hostile-test-manifest.json"
    dest: /usr/local/share/patchyard-worker/qualification/hostile-test-manifest.json
    owner: root
    group: root
    mode: "0644"

- name: Install worker-side hostile-qualification operations
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../worker/qualification/{{ item }}"
    dest: "/usr/local/sbin/{{ item }}"
    owner: root
    group: root
    mode: "0750"
  loop:
    - patchyard-hostile-launch
    - patchyard-test-result-contract

- name: Install the snapshot eligibility guard
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../worker/snapshot/check-snapshot-eligibility"
    dest: /usr/local/sbin/check-snapshot-eligibility
    owner: root
    group: root
    mode: "0755"

- name: Install the snapshot policy for runtime eligibility checks
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../policy/snapshot-policy.json"
    dest: /usr/local/share/patchyard-worker/snapshot/snapshot-policy.json
    owner: root
    group: root
    mode: "0644"

- name: Download the checksum-pinned Firecracker release
  ansible.builtin.get_url:
    url: "{{ firecracker_release_url }}"
    dest: "/var/cache/patchyard-worker/firecracker-v{{ firecracker_version }}.tgz"
    checksum: "sha256:{{ firecracker_release_sha256 }}"
    owner: root
    group: root
    mode: "0644"

- name: Create the versioned Firecracker directory
  ansible.builtin.file:
    path: "/opt/patchyard-worker/firecracker-{{ firecracker_version }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Unpack the checksum-pinned Firecracker release
  ansible.builtin.unarchive:
    src: "/var/cache/patchyard-worker/firecracker-v{{ firecracker_version }}.tgz"
    dest: "/opt/patchyard-worker/firecracker-{{ firecracker_version }}"
    remote_src: true
    creates: >-
      /opt/patchyard-worker/firecracker-{{ firecracker_version }}/release-v{{ firecracker_version }}-x86_64/firecracker-v{{ firecracker_version }}-x86_64

- name: Link the pinned Firecracker binaries
  ansible.builtin.file:
    src: >-
      /opt/patchyard-worker/firecracker-{{ firecracker_version }}/release-v{{ firecracker_version }}-x86_64/{{ item }}-v{{ firecracker_version }}-x86_64
    dest: "/usr/local/bin/{{ item }}"
    state: link
    force: true
    owner: root
    group: root
  loop:
    - firecracker
    - jailer

- name: Download the checksum-pinned Firecracker guest kernel
  ansible.builtin.get_url:
    url: "{{ firecracker_guest_kernel_url }}"
    dest: /opt/patchyard-worker/images/vmlinux
    checksum: "sha256:{{ firecracker_guest_kernel_sha256 }}"
    owner: root
    group: root
    mode: "0644"

- name: Inspect the installed parity image recipe marker
  ansible.builtin.slurp:
    src: /opt/patchyard-worker/images/fieldbook-parity.recipe-sha256
  register: worker_image_recipe_marker
  failed_when: false

- name: Build the production parity root filesystem
  ansible.builtin.command:
    argv:
      - /usr/local/share/patchyard-worker/image/build-parity-image
      - "{{ worker_image_recipe_sha256 }}"
  when: >-
    worker_image_recipe_marker.content is not defined
    or (worker_image_recipe_marker.content | b64decode | trim)
       != worker_image_recipe_sha256
  changed_when: true

- name: Hash the cached checksum-pinned Remi repository definition
  ansible.builtin.stat:
    path: /var/cache/patchyard-worker/remi-release-9.rpm
    checksum_algorithm: sha256
  register: worker_remi_release

- name: Require the exact Remi repository bootstrap artifact
  ansible.builtin.assert:
    that:
      - worker_remi_release.stat.exists
      - worker_remi_release.stat.checksum == remi_release_sha256

- name: Install the checksum-pinned Remi repository bootstrap
  ansible.builtin.dnf:
    name: /var/cache/patchyard-worker/remi-release-9.rpm
    state: present
    # The checksum-pinned bootstrap RPM installs the Remi signing key used by
    # every subsequent package. There is no earlier host trust root for itself.
    disable_gpg_check: true

- name: Import the fingerprint-pinned Remi package signing key
  ansible.builtin.rpm_key:
    key: /etc/pki/rpm-gpg/RPM-GPG-KEY-remi.el9
    fingerprint: "{{ remi_signing_key_fingerprint }}"
    state: present

- name: Reset the host PHP module before selecting the parity stream
  ansible.builtin.command:
    argv: [dnf, -y, module, reset, php]
  changed_when: false

- name: Enable the PHP 8.4 parity stream for verifier dependencies
  ansible.builtin.command:
    argv: [dnf, -y, module, enable, php:remi-8.4]
  changed_when: false

- name: Install checksum-pinned targeted-PHPUnit runtime packages
  ansible.builtin.dnf:
    name:
      - /var/cache/patchyard-worker/php-rpms/php-cli-8.4.21-1.module_php.8.4.el9.remi.x86_64.rpm
      - /var/cache/patchyard-worker/php-rpms/php-common-8.4.21-1.module_php.8.4.el9.remi.x86_64.rpm
      - /var/cache/patchyard-worker/php-rpms/php-mbstring-8.4.21-1.module_php.8.4.el9.remi.x86_64.rpm
      - /var/cache/patchyard-worker/php-rpms/php-xml-8.4.21-1.module_php.8.4.el9.remi.x86_64.rpm
    state: present
    disable_gpg_check: false

- name: Download the checksum-pinned PHPUnit PHAR
  ansible.builtin.get_url:
    url: "{{ phpunit_url }}"
    dest: /usr/local/bin/phpunit
    checksum: "sha256:{{ phpunit_sha256 }}"
    owner: root
    group: root
    mode: "0755"

- name: Hash the local factory-verify build artifact for the worker
  ansible.builtin.stat:
    path: "{{ factory_verify_binary }}"
    checksum_algorithm: sha256
  delegate_to: localhost
  become: false
  register: worker_local_factory_verify

- name: Require the exact factory-verify build artifact for the worker
  ansible.builtin.assert:
    that:
      - worker_local_factory_verify.stat.exists
      - worker_local_factory_verify.stat.checksum == factory_verify_sha256

- name: Install the reviewed factory-verify binary on the worker
  ansible.builtin.copy:
    src: "{{ factory_verify_binary }}"
    dest: /usr/local/bin/factory-verify
    owner: root
    group: root
    mode: "0755"

- name: Install the root verifier runtime harness
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../worker/runtime/patchyard-verify-runtime"
    dest: /usr/local/sbin/patchyard-verify-runtime
    owner: root
    group: root
    mode: "0750"

- name: Install worker qualification probe
  ansible.builtin.copy:
    src: qualify-factory-worker
    dest: /usr/local/sbin/qualify-factory-worker
    owner: root
    group: root
    mode: "0755"

- name: Declare transient worker paths and cleanup
  ansible.builtin.copy:
    dest: /etc/tmpfiles.d/patchyard-worker.conf
    content: |
      d /run/patchyard-worker 0700 factory-worker factory-worker -
      d /var/tmp/patchyard-worker 0700 factory-worker factory-worker 1d
    owner: root
    group: root
    mode: "0644"

- name: Materialize transient worker paths
  ansible.builtin.command:
    argv:
      - systemd-tmpfiles
      - --create
      - /etc/tmpfiles.d/patchyard-worker.conf
  changed_when: false

- name: Create nftables configuration directory
  ansible.builtin.file:
    path: /etc/nftables
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install worker private-egress policy
  ansible.builtin.template:
    src: patchyard-worker-egress.nft
    dest: /etc/nftables/patchyard-worker-egress.nft
    owner: root
    group: root
    mode: "0600"
  notify: Restart worker egress policy

- name: Install worker egress policy loader
  ansible.builtin.copy:
    src: apply-worker-egress.sh
    dest: /usr/local/sbin/apply-worker-egress
    owner: root
    group: root
    mode: "0755"
  notify: Restart worker egress policy

- name: Install worker egress systemd service
  ansible.builtin.copy:
    src: patchyard-worker-egress.service
    dest: /etc/systemd/system/patchyard-worker-egress.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart worker egress policy

- name: Enable worker private-egress rejection
  ansible.builtin.systemd:
    name: patchyard-worker-egress.service
    enabled: true
    state: started
    daemon_reload: true
