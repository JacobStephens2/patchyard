---
- name: Initialize factory hosts
  hosts: all
  become: true
  gather_facts: true
  roles:
    - role: common
    - role: exporters

- name: Initialize the factory control plane
  hosts: control_plane
  become: true
  gather_facts: false
  roles:
    - role: control_plane

- name: Initialize the disposable factory worker
  hosts: worker
  become: true
  gather_facts: false
  roles:
    - role: worker
