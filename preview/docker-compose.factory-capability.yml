networks:
  factory-capability:
    name: patchyard-preview-capability
    internal: true

services:
  traefik:
    command:
      - "--log.level=INFO"
      - "--accesslog=true"
      - "--providers.docker=true"
      - "--providers.docker.endpoint=tcp://socket-proxy:2375"
      - "--providers.docker.exposedByDefault=false"
      - "--providers.docker.network=preview-net"
      - "--providers.file.filename=/etc/traefik/patchyard-dynamic.yml"
      - "--providers.file.watch=true"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entryPoint.to=websecure"
      - "--entrypoints.web.http.redirections.entryPoint.scheme=https"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.websecure.http.tls.certresolver=letsencrypt"
      - "--entrypoints.websecure.http.tls.domains[0].main=preview.example.dev"
      - "--entrypoints.websecure.http.tls.domains[0].sans=*.preview.example.dev"
      - "--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/certs/acme.json"
      - "--certificatesresolvers.letsencrypt.acme.dnschallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.dnschallenge.provider=digitalocean"
      - "--certificatesresolvers.letsencrypt.acme.dnschallenge.delaybeforecheck=10"
    networks:
      - preview-net
      - factory-capability
    volumes:
      - /etc/patchyard-preview/patchyard-traefik-dynamic.yml:/etc/traefik/patchyard-dynamic.yml:ro,Z

  factory-capability:
    image: python:3.13.5-alpine3.22@sha256:f1a962d8ffa50b2006b72b4713a09a89e57def2d28ac28a36900bc070a00db61
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 32
    mem_limit: 64m
    cpus: 0.25
    command:
      - /usr/local/bin/python
      - -I
      - /app/patchyard-preview-capability.py
    volumes:
      - /usr/local/libexec/patchyard-preview-capability.py:/app/patchyard-preview-capability.py:ro,Z
      - /var/lib/patchyard-preview/capabilities:/capabilities:ro,Z
      - /etc/patchyard-preview/patchyard-api-key:/secret/patchyard-api-key:ro,Z
    networks:
      - factory-capability
