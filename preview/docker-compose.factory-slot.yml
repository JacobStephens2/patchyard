services:
  fieldbook:
    volumes:
      # The preview image uses Apache's php-fpm proxy.  Preserve Traefik's
      # translated application authority in the FastCGI environment so the
      # legacy authenticate.php entry point can validate it.
      - /etc/patchyard-preview/patchyard-authorization.conf:/etc/httpd/conf.d/99-patchyard-authorization.conf:ro,Z
    labels:
      # Traefik wraps this list in reverse request order: the capability
      # middleware therefore runs first, then the strip removes the private
      # header before proxying to legacy PHP.
      traefik.http.routers.preview-${PREVIEW_SLOT}.middlewares: "patchyard-capability-strip@file,patchyard-capability@file"
