# The factory capability terminates at Traefik. ForwardAuth removes it and
# supplies this private replacement header to Apache. Apache copies the value
# byte-for-byte into ordinary Authorization, removes the intermediate, and
# explicitly passes Authorization through the PHP-FPM CGI boundary.
<Directory "/var/www/html">
    RequestHeader set Authorization "expr=%{req:X-Patchyard-Factory-Preview-Authorization}"
    RequestHeader unset X-Patchyard-Factory-Preview-Authorization
    CGIPassAuth On
</Directory>
