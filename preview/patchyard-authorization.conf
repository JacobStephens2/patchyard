# The factory capability terminates at Traefik. ForwardAuth translates it to
# the preview's ordinary application Authorization value, then the ordered
# edge middleware removes the factory capability before Apache receives the
# request. mod_proxy_fcgi honors CGIPassAuth, which lets legacy PHP inspect
# only that translated Authorization header as a CGI variable.
<Directory "/var/www/html">
    CGIPassAuth On
</Directory>
