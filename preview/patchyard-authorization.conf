# The factory capability terminates at Traefik. ForwardAuth removes it and
# supplies this private replacement header to Apache. Apache copies the value
# byte-for-byte into the ordinary legacy application header, then removes the
# intermediate before proxying to PHP-FPM.
<Directory "/var/www/html">
    RequestHeader set ETA_API_KEY "expr=%{req:X-Patchyard-Factory-Preview-Key}"
    RequestHeader unset X-Patchyard-Factory-Preview-Key
</Directory>
