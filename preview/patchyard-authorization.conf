# The factory capability terminates at Traefik. ForwardAuth translates it to
# the preview's private replacement header while it removes the factory
# capability before Apache receives the request. Apache promotes that header to its
# ordinary Authorization request header, removes the intermediate header, and
# then passes only Authorization to legacy PHP-FPM as a CGI variable.
<Directory "/var/www/html">
    RequestHeader set Authorization "expr=%{HTTP:X-Patchyard-Factory-Preview-Authorization}"
    RequestHeader unset X-Patchyard-Factory-Preview-Authorization
    CGIPassAuth On
</Directory>
