# The factory capability terminates at Traefik. ForwardAuth translates it to
# the preview's ordinary application Authorization value. mod_proxy_fcgi
# constructs PHP-FPM's CGI environment after ordinary SetEnvIf handling, so
# set the FCGI variable at that boundary. It contains no factory capability.
ProxyFCGISetEnvIf "req_novary('Authorization') =~ m|^(.+)$|" HTTP_AUTHORIZATION "$1"
