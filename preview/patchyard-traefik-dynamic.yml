http:
  middlewares:
    patchyard-capability:
      forwardAuth:
        address: "http://factory-capability:8080/auth"
        # Strip the browser's private capability before proxying, then copy
        # only the translator's ordinary application Authorization response.
        authResponseHeadersRegex: "^(Authorization|X-Patchyard-Factory-Capability)$"
        trustForwardHeader: false
