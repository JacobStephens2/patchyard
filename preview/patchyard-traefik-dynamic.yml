http:
  middlewares:
    patchyard-capability:
      forwardAuth:
        address: "http://factory-capability:8080/auth"
        # Strip the browser's private capability before proxying, then copy
        # only the translator's private-to-Apache replacement header.
        authResponseHeadersRegex: "^(X-Patchyard-Factory-Capability|X-Patchyard-Factory-Preview-Authorization)$"
        trustForwardHeader: false
