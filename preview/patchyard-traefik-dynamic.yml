http:
  middlewares:
    patchyard-capability:
      forwardAuth:
        address: "http://factory-capability:8080/auth"
        # Strip the browser's private capability before proxying, then copy
        # only the translator's ordinary application authority header.
        authResponseHeaders:
          - ETA_API_KEY
        authResponseHeadersRegex: "^X-Patchyard-Factory-Capability$"
        trustForwardHeader: false
